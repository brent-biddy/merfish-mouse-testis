# A local env for developing this repo's scripts and notebooks. Versions match python_cpu
# 1.0.0, the image the pipeline runs in -- do not re-solve. The GPU steps are not here; cupy
# and rapids-singlecell come from python_gpu.
name: merfish-mouse-testis

channels:
  - conda-forge

dependencies:
  - python=3.12.13
  - pip

  # Notebook execution. Quarto renders through this machinery even though it is installed
  # separately.
  - ipykernel=7.3.0
  - nbclient=0.11.0
  - nbformat=5.10.4
  - pyyaml=6.0.3

  # Core numerics
  - numpy=2.4.6
  - pandas=2.3.3
  - scipy=1.16.3
  - matplotlib=3.11.0

  # Single cell and spatial
  - anndata=0.12.19
  - scanpy=1.12.1
  - spatialdata=0.7.3
  - spatialdata-io=0.7.0
  - python-igraph=1.0.0
  - leidenalg=0.12.0

  # Geometry and imaging: segmentation boundaries and label rasters
  - geopandas=1.1.4
  - shapely=2.1.2
  - scikit-image=0.26.0
  - h5py=3.16.0

  - pip:
    - seaborn==0.13.2
